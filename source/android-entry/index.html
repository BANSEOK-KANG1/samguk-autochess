<!doctype html>
<html lang="ko" class="android-shell">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0c0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>삼국지 오토체스</title>
    <link rel="icon" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <style>
      html.android-shell,
      html.android-shell body,
      html.android-shell #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #070807;
      }
    </style>
    <script>
      (function () {
        var W = 1180,
          H = 720;
        function fit() {
          var vv = window.visualViewport;
          var w = Math.max(
            1,
            Math.round((vv && vv.width) || window.innerWidth || screen.width),
          );
          var h = Math.max(
            1,
            Math.round((vv && vv.height) || window.innerHeight || screen.height),
          );
          var padX = Math.max(6, Math.round(w * 0.01));
          var padY = Math.max(6, Math.round(h * 0.018));
          var scale = Math.min((w - padX * 2) / W, (h - padY * 2) / H);
          var root = document.documentElement;
          root.classList.add("android-shell");
          root.style.setProperty("--app-scale-x", String(scale));
          root.style.setProperty("--app-scale-y", String(scale));
          root.style.setProperty("--app-vw", w + "px");
          root.style.setProperty("--app-vh", h + "px");
          root.style.setProperty(
            "--app-offset-x",
            Math.round((w - W * scale) / 2) + "px",
          );
          root.style.setProperty(
            "--app-offset-y",
            Math.round((h - H * scale) / 2) + "px",
          );
        }
        fit();
        window.addEventListener("resize", fit);
        window.addEventListener("orientationchange", fit);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
